<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Estudio Arpón — Alojamiento</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#26304a;
    --ink-soft:#5b6580;
    --paper:#faf7f1;
    --paper-raised:#ffffff;
    --sand:#e7ddc9;
    --clay:#b0563a;
    --clay-soft:#c97a5c;
    --pine:#5c7a5e;
    --line:#e1d9c8;
    --radius:4px;
    --shadow: 0 10px 30px -18px rgba(38,48,74,0.35);
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:"Work Sans", sans-serif;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{
    font-family:"Fraunces", serif;
    font-weight:500;
    margin:0;
    color:var(--ink);
  }
  img{max-width:100%;display:block;}
  a{color:inherit;}

  /* ---------- HERO CARRUSEL ---------- */
  .hero{
    position:relative;
    width:100%;
    height:min(78vh, 620px);
    min-height:320px;
    overflow:hidden;
    background:var(--ink);
  }
  .hero-track{
    position:absolute;
    inset:0;
  }
  .hero-slide{
    position:absolute;
    inset:0;
    opacity:0;
    transition:opacity 1.1s ease;
  }
  .hero-slide.active{opacity:1;}
  .hero-slide img{
    width:100%;
    height:100%;
    object-fit:cover;
  }
  .hero-slide::after{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(180deg, rgba(38,48,74,0.05) 0%, rgba(38,48,74,0.55) 100%);
  }
  .hero-copy{
    position:absolute;
    left:0; right:0; bottom:0;
    padding:clamp(24px,5vw,64px);
    color:#fff;
    z-index:3;
  }
  .hero-copy .eyebrow{
    font-size:0.85rem;
    letter-spacing:0.02em;
    color:var(--sand);
    margin-bottom:6px;
    display:block;
  }
  .hero-copy h1{
    font-size:clamp(1.8rem, 4vw, 3rem);
    color:#fff;
    max-width:20ch;
  }
  .hero-dots{
    position:absolute;
    bottom:clamp(16px,3vw,28px);
    right:clamp(20px,4vw,56px);
    display:flex;
    gap:8px;
    z-index:4;
  }
  .hero-dot{
    width:9px;height:9px;border-radius:50%;
    background:rgba(255,255,255,0.45);
    border:none;
    cursor:pointer;
    padding:0;
    transition:background .3s, transform .3s;
  }
  .hero-dot.active{background:#fff; transform:scale(1.2);}
  .hero-arrow{
    position:absolute;
    top:50%; transform:translateY(-50%);
    width:42px;height:42px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,0.5);
    background:rgba(38,48,74,0.25);
    color:#fff;
    font-size:1.1rem;
    cursor:pointer;
    z-index:4;
    display:flex;align-items:center;justify-content:center;
    transition:background .25s;
  }
  .hero-arrow:hover{background:rgba(38,48,74,0.55);}
  .hero-arrow.prev{left:20px;}
  .hero-arrow.next{right:20px;}
  @media (max-width:600px){
    .hero-arrow{width:34px;height:34px;font-size:1rem;}
  }

  /* ---------- LAYOUT GENERAL ---------- */
  main{
    max-width:1080px;
    margin:0 auto;
    padding:clamp(32px,6vw,64px) clamp(18px,5vw,32px) 80px;
  }
  section{margin-bottom:clamp(48px,8vw,88px);}
  .section-head{
    margin-bottom:24px;
    padding-bottom:14px;
    border-bottom:1px solid var(--line);
  }
  .section-head h2{
    font-size:clamp(1.5rem,3vw,2.1rem);
  }
  .section-head p{
    color:var(--ink-soft);
    margin-top:6px;
    max-width:60ch;
  }

  /* ---------- GALERÍA ---------- */
  .gallery-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(150px,1fr));
    gap:10px;
  }
  .gallery-item{
    position:relative;
    aspect-ratio:1/1;
    overflow:hidden;
    border-radius:var(--radius);
    cursor:zoom-in;
    background:var(--sand);
  }
  .gallery-item img{
    width:100%;height:100%;object-fit:cover;
    transition:transform .5s ease;
  }
  .gallery-item:hover img{transform:scale(1.06);}
  .gallery-item::after{
    content:"";
    position:absolute; inset:0;
    box-shadow: inset 0 0 0 1px rgba(38,48,74,0.08);
  }

  .lightbox{
    position:fixed; inset:0;
    background:rgba(20,24,38,0.92);
    display:none;
    align-items:center; justify-content:center;
    z-index:100;
    padding:24px;
  }
  .lightbox.open{display:flex;}
  .lightbox img{
    max-width:min(90vw, 1000px);
    max-height:82vh;
    object-fit:contain;
    border-radius:2px;
    box-shadow:0 20px 60px rgba(0,0,0,0.5);
  }
  .lightbox-close, .lightbox-arrow{
    position:absolute;
    color:#fff;
    background:rgba(255,255,255,0.12);
    border:1px solid rgba(255,255,255,0.35);
    border-radius:50%;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .lightbox-close{
    top:20px; right:20px;
    width:40px;height:40px;
    font-size:1.2rem;
  }
  .lightbox-arrow{
    top:50%; transform:translateY(-50%);
    width:46px;height:46px;
    font-size:1.3rem;
  }
  .lightbox-arrow.prev{left:16px;}
  .lightbox-arrow.next{right:16px;}
  .lightbox-count{
    position:absolute;
    bottom:20px; left:50%; transform:translateX(-50%);
    color:rgba(255,255,255,0.75);
    font-size:0.85rem;
    letter-spacing:0.03em;
  }

  /* ---------- CARACTERÍSTICAS / ACORDEÓN ---------- */
  .accordion{
    border-top:1px solid var(--line);
  }
  .accordion-item{
    border-bottom:1px solid var(--line);
  }
  .accordion-trigger{
    width:100%;
    display:flex;
    align-items:center;
    gap:16px;
    padding:18px 4px;
    background:none;
    border:none;
    cursor:pointer;
    text-align:left;
    font-family:"Work Sans", sans-serif;
  }
  .accordion-icon{
    width:38px;height:38px;
    border-radius:50%;
    background:var(--sand);
    display:flex;align-items:center;justify-content:center;
    font-size:1.05rem;
    flex-shrink:0;
  }
  .accordion-title{
    flex:1;
    font-size:1.02rem;
    font-weight:600;
    color:var(--ink);
  }
  .accordion-chevron{
    width:20px;height:20px;
    flex-shrink:0;
    color:var(--ink-soft);
    transition:transform .3s ease;
  }
  .accordion-item.open .accordion-chevron{transform:rotate(180deg);}
  .accordion-panel{
    max-height:0;
    overflow:hidden;
    transition:max-height .35s ease;
  }
  .accordion-panel-inner{
    padding:0 4px 22px 70px;
    color:var(--ink-soft);
  }
  .accordion-panel-inner ul{
    margin:0;
    padding:0;
    list-style:none;
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(150px,1fr));
    gap:8px 20px;
  }
  .accordion-panel-inner li{
    position:relative;
    padding-left:16px;
    font-size:0.96rem;
  }
  .accordion-panel-inner li::before{
    content:"";
    position:absolute;
    left:0; top:0.6em;
    width:5px;height:5px;
    border-radius:50%;
    background:var(--clay);
  }

  /* ---------- SUB-ACORDEÓN (Check-in Flexible) ---------- */
  .sub-accordion{
    border-top:1px solid var(--line);
    max-width:420px;
  }
  .sub-accordion-item{
    border-bottom:1px solid var(--line);
  }
  .sub-accordion-item:last-child{border-bottom:none;}
  .sub-accordion-trigger{
    width:100%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:11px 2px;
    background:none;
    border:none;
    cursor:pointer;
    text-align:left;
    font-family:"Work Sans", sans-serif;
    font-weight:600;
    font-size:0.92rem;
    letter-spacing:0.03em;
    color:var(--ink);
  }
  .sub-accordion-chevron{
    width:16px;height:16px;
    flex-shrink:0;
    color:var(--clay);
    transition:transform .3s ease;
  }
  .sub-accordion-item.open .sub-accordion-chevron{transform:rotate(180deg);}
  .sub-accordion-panel{
    max-height:0;
    overflow:hidden;
    transition:max-height .3s ease;
  }
  .sub-accordion-panel-inner{
    padding:0 2px 14px 2px;
    color:var(--ink-soft);
    font-size:0.95rem;
  }

  footer{
    text-align:center;
    padding:28px 16px 40px;
    color:var(--ink-soft);
    font-size:0.85rem;
  }
</style>
</head>
<body>

<!-- ============ HERO CARRUSEL ============ -->
<header class="hero" id="hero">
  <div class="hero-track" id="heroTrack">
    <!-- Las slides se insertan por JS a partir de la lista IMAGES.hero -->
  </div>
  <button class="hero-arrow prev" aria-label="Anterior" id="heroPrev">&#8249;</button>
  <button class="hero-arrow next" aria-label="Siguiente" id="heroNext">&#8250;</button>
  <div class="hero-copy">
    <span class="eyebrow">Alojamiento Vacacional</span>
    <h1>Estudio Arpón</h1>
  </div>
  <div class="hero-dots" id="heroDots"></div>
</header>

<main>

  <!-- ============ GALERÍA ============ -->
  <section id="galeria">
    <div class="section-head">
      <h2>Galería</h2>
      <p>Toca cualquier imagen para ampliarla.</p>
    </div>
    <div class="gallery-grid" id="galleryGrid"></div>
  </section>

  <!-- ============ CARACTERÍSTICAS ============ -->
  <section id="caracteristicas">
    <div class="section-head">
      <h2>Características</h2>
      <p>Todos los extras que incluye el alojamiento, organizado por Categorías.</p>
    </div>
    <div class="accordion" id="accordion"></div>
  </section>

</main>

<!-- ============ LIGHTBOX ============ -->
<div class="lightbox" id="lightbox">
  <button class="lightbox-close" id="lbClose" aria-label="Cerrar">&times;</button>
  <button class="lightbox-arrow prev" id="lbPrev" aria-label="Anterior">&#8249;</button>
  <img id="lbImage" src="" alt="">
  <button class="lightbox-arrow next" id="lbNext" aria-label="Siguiente">&#8250;</button>
  <div class="lightbox-count" id="lbCount"></div>
</div>

<footer>Estudio Arpón · Reserva directa</footer>

<script>
/* =========================================================================
   CONTENIDO EDITABLE
   - Cambia las URLs de "hero" y "gallery" por tus propias fotos.
   - Cambia el texto de "features" por las características reales.
   ========================================================================= */

const IMAGES = {
  hero: [
    "imagenes/carrusel/Amanecer.jpg",    // Carrusel - Imagen 1
    "imagenes/carrusel/CaladelPino.png", // Carrusel - Imagen 2
    "imagenes/carrusel/LaManga.jpg",     // Carrusel - Imagen 3
    "imagenes/carrusel/Mares.png"        // Carrusel - Imagen 4
  ],
  gallery: [
    "imagenes/galeria/Aire.jpg",      // Galería - Miniatura 1
    "imagenes/galeria/Baño.jpg",      // Galería - Miniatura 2
    "imagenes/galeria/Cocina.jpg",    // Galería - Miniatura 3
    "imagenes/galeria/Comoda.jpg",    // Galería - Miniatura 4
    "imagenes/galeria/Recibidor.jpg", // Galería - Miniatura 5
    "imagenes/galeria/Salon.jpg",     // Galería - Miniatura 6
    "imagenes/galeria/Terraza.png",   // Galería - Miniatura 7
    "imagenes/galeria/Tv.jpg"         // Galería - Miniatura 8
  ]
};

const FEATURES = [
  { icon: "&#127760;", title: "Conexión a Internet", items: ["WiFi de alta velocidad"] },
  { icon: "&#128663;", title: "Opciones de Aparcamiento", items: ["Aparcamiento privado exterior", "Parking para carga/descarga de equipajes"] },
  { icon: "&#128119;", title: "Servicios", items: ["Aire acondicionado", "Lavadora", "Secadora", "Acceso a llaves mediante Código", "Ascensor",  "Seguridad"] },
  { icon: "&#129681;", title: "Comedor", items: ["Salón-Bar", "Zona de Terraza Exterior"] },
  { icon: "&#127859;", title: "La Cocina tiene", items: ["Utensilios de cocina", "Nevera", "Vitrocerámica", "Vajilla completa", "Juego de Vasos y Tazas", "Cubertería completa"] },
  { icon: "&#127958;", title: "Recreación", items: ["Piscina Exterior en temporada", "Acceso privado a Playa", "Tumbonas", "Terraza-Solarium", "Jardín"] }, 
  { icon: "&#128703;", title: "El Baño tiene", items: ["Toallas", "Secador", "Agua caliente"] },
  { icon: "&#128719;", title: "El Estudio tiene", items: ["Almacenamiento", "Ropa de cama", "Juegos de Almohadas", "Limpieza Incluida"] },
  { icon: "&#128250;", title: "Entretenimiento", items: ["Televisión", "Prismáticos", "Vistas de Atardecer"] },
  { icon: "&#128203;", title: "Normas Generales", items: ["Amigos del Aire puro y Limpio", "Prohibido Fumar en el Residencial", "Detectores de Humo", "No se admiten Mascotas"] },
  { icon: "&#128340;", title: "Check-in Flexible", sub: [
      { title: "ENTRADA", text: "Desde las 15:00 hasta las 16:00." },
      { title: "SALIDA", text: "Desde las 10:00 hasta las 11:00." }
    ]
  }
];

/* =========================================================================
   CARRUSEL DE CABECERA
   ========================================================================= */
(function heroCarousel(){
  const track = document.getElementById("heroTrack");
  const dotsWrap = document.getElementById("heroDots");
  let current = 0;
  let timer = null;
  const AUTOPLAY_MS = 5000;

  IMAGES.hero.forEach((src, i) => {
    const slide = document.createElement("div");
    slide.className = "hero-slide" + (i === 0 ? " active" : "");
    slide.innerHTML = `<img src="${src}" alt="Vista del alojamiento ${i+1}">`;
    track.appendChild(slide);

    const dot = document.createElement("button");
    dot.className = "hero-dot" + (i === 0 ? " active" : "");
    dot.addEventListener("click", () => goTo(i));
    dotsWrap.appendChild(dot);
  });

  const slides = track.querySelectorAll(".hero-slide");
  const dots = dotsWrap.querySelectorAll(".hero-dot");

  function goTo(i){
    slides[current].classList.remove("active");
    dots[current].classList.remove("active");
    current = (i + slides.length) % slides.length;
    slides[current].classList.add("active");
    dots[current].classList.add("active");
  }

  function next(){ goTo(current + 1); }
  function prev(){ goTo(current - 1); }

  function startAutoplay(){ timer = setInterval(next, AUTOPLAY_MS); }
  function stopAutoplay(){ clearInterval(timer); }

  document.getElementById("heroNext").addEventListener("click", () => { next(); stopAutoplay(); startAutoplay(); });
  document.getElementById("heroPrev").addEventListener("click", () => { prev(); stopAutoplay(); startAutoplay(); });

  const hero = document.getElementById("hero");
  hero.addEventListener("mouseenter", stopAutoplay);
  hero.addEventListener("mouseleave", startAutoplay);

  startAutoplay();
})();

/* =========================================================================
   GALERÍA + LIGHTBOX CON ZOOM
   ========================================================================= */
(function galleryLightbox(){
  const grid = document.getElementById("galleryGrid");
  const lightbox = document.getElementById("lightbox");
  const lbImage = document.getElementById("lbImage");
  const lbCount = document.getElementById("lbCount");
  let current = 0;

  IMAGES.gallery.forEach((src, i) => {
    const item = document.createElement("div");
    item.className = "gallery-item";
    item.innerHTML = `<img src="${src}" alt="Foto del alojamiento ${i+1}" loading="lazy">`;
    item.addEventListener("click", () => open(i));
    grid.appendChild(item);
  });

  function open(i){
    current = i;
    render();
    lightbox.classList.add("open");
  }
  function close(){ lightbox.classList.remove("open"); }
  function render(){
    lbImage.src = IMAGES.gallery[current];
    lbCount.textContent = (current + 1) + " / " + IMAGES.gallery.length;
  }
  function next(){ current = (current + 1) % IMAGES.gallery.length; render(); }
  function prev(){ current = (current - 1 + IMAGES.gallery.length) % IMAGES.gallery.length; render(); }

  document.getElementById("lbClose").addEventListener("click", close);
  document.getElementById("lbNext").addEventListener("click", next);
  document.getElementById("lbPrev").addEventListener("click", prev);
  lightbox.addEventListener("click", (e) => { if (e.target === lightbox) close(); });
  document.addEventListener("keydown", (e) => {
    if (!lightbox.classList.contains("open")) return;
    if (e.key === "Escape") close();
    if (e.key === "ArrowRight") next();
    if (e.key === "ArrowLeft") prev();
  });
})();

/* =========================================================================
   ACORDEÓN DE CARACTERÍSTICAS
   ========================================================================= */
(function accordion(){
  const wrap = document.getElementById("accordion");

  FEATURES.forEach((f) => {
    const item = document.createElement("div");
    item.className = "accordion-item";

    // Contenido del panel: lista simple de extras, o sub-acordeón (p.ej. Check-in Flexible)
    const panelContent = f.sub
      ? `<div class="sub-accordion">${
          f.sub.map((s, idx) => `
            <div class="sub-accordion-item">
              <button class="sub-accordion-trigger" data-sub-index="${idx}">
                <span>${s.title}</span>
                <svg class="sub-accordion-chevron" viewBox="0 0 20 20" fill="none">
                  <path d="M5 7.5L10 12.5L15 7.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </button>
              <div class="sub-accordion-panel">
                <div class="sub-accordion-panel-inner">${s.text}</div>
              </div>
            </div>
          `).join("")
        }</div>`
      : `<ul>${f.items.map(t => `<li>${t}</li>`).join("")}</ul>`;

    item.innerHTML = `
      <button class="accordion-trigger">
        <span class="accordion-icon">${f.icon}</span>
        <span class="accordion-title">${f.title}</span>
        <svg class="accordion-chevron" viewBox="0 0 20 20" fill="none">
          <path d="M5 7.5L10 12.5L15 7.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <div class="accordion-panel">
        <div class="accordion-panel-inner">${panelContent}</div>
      </div>
    `;

    const trigger = item.querySelector(".accordion-trigger");
    const panel = item.querySelector(".accordion-panel");

    function refreshHeight(){
      if (item.classList.contains("open")){
        panel.style.maxHeight = panel.scrollHeight + "px";
      }
    }

    trigger.addEventListener("click", () => {
      const isOpen = item.classList.contains("open");
      if (isOpen){
        item.classList.remove("open");
        panel.style.maxHeight = null;
      } else {
        item.classList.add("open");
        panel.style.maxHeight = panel.scrollHeight + "px";
      }
    });

    // Sub-acordeón interno (ENTRADA / SALIDA)
    item.querySelectorAll(".sub-accordion-item").forEach((subItem) => {
      const subTrigger = subItem.querySelector(".sub-accordion-trigger");
      const subPanel = subItem.querySelector(".sub-accordion-panel");

      subTrigger.addEventListener("click", () => {
        const subIsOpen = subItem.classList.contains("open");
        if (subIsOpen){
          subItem.classList.remove("open");
          subPanel.style.maxHeight = null;
        } else {
          subItem.classList.add("open");
          subPanel.style.maxHeight = subPanel.scrollHeight + "px";
        }
        refreshHeight();
      });
    });

    wrap.appendChild(item);
  });
})();
</script>
</body>
</html>
